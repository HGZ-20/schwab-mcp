[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "schwab-mcp"
version = "1.0.0"
description = "Production-ready Charles Schwab Market Data & Trading MCP Server with OAuth 2.1 remote hosting and zero-setup local stdio support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Schwab MCP Contributors" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "charles-schwab",
    "schwab",
    "trading",
    "market-data",
    "options",
    "oauth2",
    "ai-agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "mcp>=2.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/HGZ-20/schwab-mcp"
Documentation = "https://github.com/HGZ-20/schwab-mcp#readme"
Repository = "https://github.com/HGZ-20/schwab-mcp"
Issues = "https://github.com/HGZ-20/schwab-mcp/issues"
Changelog = "https://github.com/HGZ-20/schwab-mcp/blob/main/CHANGELOG.md"

[project.scripts]
schwab-mcp = "schwab_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/schwab_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::mcp.shared.exceptions.MCPDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
