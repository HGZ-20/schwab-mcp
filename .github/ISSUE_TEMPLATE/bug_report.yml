name: Bug Report
description: Report a bug or unexpected behavior in schwab-mcp
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment Mode
      options:
        - "Mode 1: Remote Hosted (Streamable HTTP + OAuth 2.1)"
        - "Mode 2: Local stdio (uvx / Cursor / Codex / Claude)"
        - "CLI (schwab-mcp auth / doctor)"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Output / Logs (Redact all secrets & account numbers!)
      render: text
