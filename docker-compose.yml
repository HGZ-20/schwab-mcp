# Mode 1 Remote Hosted Deployment Example (Streamable HTTP + MCP OAuth 2.1 + Caddy Auto-HTTPS)
#
# Quick start:
#   1. Point DNS A/AAAA record for `schwab-mcp.example.com` to this server.
#   2. Register `https://schwab-mcp.example.com/schwab/callback` in Schwab Developer Portal.
#   3. Copy `.env.example` to `.env` and fill in SCHWAB_APP_KEY, SCHWAB_APP_SECRET, and MCP_PUBLIC_URL.
#   4. Run: `docker compose up -d`

services:
  schwab-mcp:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
      MCP_AUTH_MODE: oauth
      SCHWAB_DATA_DIR: /data
    volumes:
      - schwab_mcp_data:/data
    expose:
      - "8765"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - schwab-mcp
    ports:
      - "80:80"
      - "443:443"
    command: >
      caddy reverse-proxy
      --from ${MCP_PUBLIC_DOMAIN:-schwab-mcp.example.com}
      --to schwab-mcp:8765
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  schwab_mcp_data:
  caddy_data:
  caddy_config:
